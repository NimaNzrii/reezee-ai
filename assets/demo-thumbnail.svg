<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ReeZee AI quick demo</title>
  <desc id="desc">A clickable video thumbnail with a centered play button. Opens the demo video in a new tab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1f1a"/>
      <stop offset="1" stop-color="#0d110d"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8ff87"/>
      <stop offset="1" stop-color="#8fd83f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="playShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" fill-opacity="0.03"/>
    </pattern>
  </defs>

  <rect width="960" height="540" rx="16" fill="url(#bg)"/>

  <rect width="960" height="540" rx="16" fill="url(#scanlines)"/>

  <rect x="0" y="0" width="960" height="6" rx="3" fill="#b2e54e" opacity="0.6"/>

  <g transform="translate(380 170)">
    <rect x="0" y="0" width="200" height="200" rx="100" fill="#141814" stroke="#2e362e" stroke-width="2"/>
    <g transform="translate(85 65)" filter="url(#playShadow)">
      <circle cx="30" cy="30" r="30" fill="url(#playGrad)"/>
      <path d="M26 18h20v24H26z" fill="#172015" opacity="0.9"/>
      <path d="M40 24l14 12-14 12V24z" fill="#172015"/>
    </g>
  </g>

  <text x="480" y="430" fill="#f5f8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" text-anchor="middle" font-weight="700" letter-spacing="0.5">ReeZee AI — Quick Feature Demo</text>

  <text x="480" y="470" fill="#9ea99b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="1">CLICK TO WATCH</text>

  <text x="480" y="500" fill="#687065" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle">Opens in a new tab · Demo of one feature · More coming soon</text>

  <rect x="0" y="534" width="960" height="6" rx="3" fill="#b2e54e" opacity="0.6"/>
</svg>
