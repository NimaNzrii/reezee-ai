<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ReeZee AI quick demo</title>
  <desc id="desc">A clickable video thumbnail with a centered play button. Opens the demo video in a new tab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202520"/>
      <stop offset="1" stop-color="#111511"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="playShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <radialGradient id="playGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d8ff87"/>
      <stop offset="1" stop-color="#8fd83f"/>
    </radialGradient>
  </defs>

  <rect width="960" height="540" rx="28" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="40" width="880" height="460" rx="24" fill="#171b17" stroke="#2e362e" stroke-width="2"/>
  </g>

  <rect x="40" y="40" width="880" height="460" rx="24" fill="url(#bg)" opacity="0.35"/>

  <rect x="40" y="40" width="880" height="4" rx="2" fill="#b2e54e" opacity="0.35"/>

  <g transform="translate(430 220)" filter="url(#playShadow)">
    <circle cx="50" cy="50" r="50" fill="url(#playGrad)"/>
    <path d="M44 36h20v28H44z" fill="#172015" opacity="0.92"/>
    <path d="M56 42l16 16-16 16V42z" fill="#172015"/>
  </g>

  <text x="480" y="470" fill="#9ea99b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle" font-weight="600" letter-spacing="1">WATCH QUICK DEMO</text>

  <text x="480" y="496" fill="#687065" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle">Click to open in a new tab</text>
</svg>
