<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">ReeZee AI quick demo</title>
  <desc id="desc">Clickable video thumbnail using a dark frame with centered play button. Opens the demo video in a new tab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181c18"/>
      <stop offset="1" stop-color="#0d110d"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffb0"/>
      <stop offset="1" stop-color="#8fd83f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="20" fill="url(#bg)"/>

  <rect x="24" y="24" width="912" height="492" rx="14" fill="#0a0e0a" opacity="0.5" stroke="#2a302a" stroke-width="1.5"/>

  <g transform="translate(430 195)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="50" fill="url(#playGrad)"/>
    <path d="M46 34h24v32H46z" fill="#0d110d" opacity="0.85"/>
    <path d="M60 40l18 14-18 14V40z" fill="#0d110d"/>
  </g>

  <text x="480" y="500" fill="#9ea99b" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" text-anchor="middle" letter-spacing="1">CLICK TO PLAY</text>
</svg>
