<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">ReeZee AI product banner</title>
  <desc id="desc">A branded illustration connecting AI chat, Photoshop, ComfyUI, and external agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111511"/>
      <stop offset="0.52" stop-color="#171c18"/>
      <stop offset="1" stop-color="#0b0e0c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#b2e54e" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#79c942" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#79c942" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8ff87"/>
      <stop offset="1" stop-color="#8fd83f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#b2e54e" stroke-opacity="0.045"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
