  <text x="800" y="150" fill="#f5f8f2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" text-anchor="middle" letter-spacing="-3">ReeZee AI</text>
  <text x="800" y="210" fill="#b9c4b7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" text-anchor="middle">Photoshop-native creation • ComfyUI freedom • Agent-ready control</text>

