    <rect x="530" y="386" width="160" height="230" rx="18" fill="#171b17"/>
    <rect x="712" y="386" width="358" height="230" rx="18" fill="#111511"/>
    <rect x="735" y="410" width="310" height="34" rx="10" fill="#282e28"/>
